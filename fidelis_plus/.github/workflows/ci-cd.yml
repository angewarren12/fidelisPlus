name: CI/CD Pipeline — Fidelis Plus

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-laravel:
    name: Backend Laravel (Tests & Lint)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: fidelis_plus_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, curl, openssl
          coverage: none

      - name: Copy .env.testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fidelis_plus_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Run Laravel Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fidelis_plus_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --parallel

  frontend-angular:
    name: Frontend Angular (Build & Lint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fidelis_plus_backoffice

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fidelis_plus_backoffice/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Backoffice (Production)
        run: npm run build -- --configuration=production
