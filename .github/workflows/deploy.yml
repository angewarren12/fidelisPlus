name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, zip, gd, bcmath, exif, pcntl, xml, ctype, fileinfo, tokenizer, openssl, pdo, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        working-directory: fidelis_plus
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fidelis_plus_backoffice/package-lock.json

      - name: Install Node dependencies
        working-directory: fidelis_plus_backoffice
        run: npm ci

      - name: Build Angular (production)
        working-directory: fidelis_plus_backoffice
        run: npm run build -- --configuration production

      # Empaquetage en UN SEUL dossier reproduisant exactement le docroot cible
      # (htdocs/fidelisplus.cieria-app.com/) : Angular à la racine, Laravel complet
      # dans laravel/ (accès direct bloqué par le .htaccess racine, sauf laravel/public/).
      # Approche validée sur ce même hébergement LWS par un autre projet
      # (voir deploy/subdomain.htaccess pour le détail des règles de réécriture).
      - name: Package release
        run: |
          mkdir -p /tmp/release/laravel

          rsync -a \
            --exclude='.git' --exclude='node_modules' \
            --exclude='storage/logs' --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' --exclude='storage/framework/views' \
            fidelis_plus/ /tmp/release/laravel/
          mkdir -p /tmp/release/laravel/storage/framework/cache/data \
                   /tmp/release/laravel/storage/framework/sessions \
                   /tmp/release/laravel/storage/framework/views \
                   /tmp/release/laravel/storage/logs

          cp fidelis_plus/index.deploy.php /tmp/release/laravel/public/index.php

          cp -r fidelis_plus_backoffice/dist/fidelis_plus_backoffice/browser/. /tmp/release/
          cp deploy/subdomain.htaccess /tmp/release/.htaccess

          cd /tmp/release && tar -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz "$GITHUB_WORKSPACE/release.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Validation manuelle : le job "build" tourne à chaque push (vérifie que ça
    # compile), mais "deploy" ne se lance qu'en cliquant "Run workflow" à la main
    # dans l'onglet Actions (jamais automatiquement sur un simple push).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Extract release locally
        run: mkdir release && tar -xzf release.tar.gz -C release

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Transfert SFTP pur (aucune commande à distance possible sur cet hébergement —
      # voir section 2.4 du guide). Pas de --delete : ne supprime jamais un fichier
      # absent de l'archive (protège .env, storage/, uploads déjà en place).
      - name: Upload release (Angular + Laravel) via SFTP
        run: |
          lftp -u "${{ secrets.SSH_USER }},${{ secrets.SSH_PASSWORD }}" sftp://${{ secrets.SSH_HOST }} -e "
            set sftp:auto-confirm yes
            set net:max-retries 2
            mirror -R --parallel=4 --verbose release ${{ secrets.DEPLOY_PATH }}
            quit
          "

      - name: Run post-deploy commands via webhook
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
          echo "HTTP status: $http_code"
          cat response.json
          echo
          if [ "$http_code" -ge 400 ]; then
            exit 1
          fi
